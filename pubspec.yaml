name: lota_offline
description: Lota — Bingo 90 Argentino. App offline para jugar Lota Argentina.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  get_it: ^9.1.1
  go_router: ^14.8.1
  google_fonts: ^8.0.2
  intl: ^0.20.2
  shared_preferences: ^2.3.5
  shimmer: ^3.0.0
  universal_html: ^2.2.4

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo/lota-logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  # Fondo adaptativo: alpha 0 (transparente). En algunos launchers Android
  # puede verse negro o el wallpaper según el OEM.
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: "assets/images/logo/lota-logo.png"
  web:
    generate: true
    image_path: "assets/images/logo/lota-logo.png"
    # Manifest PWA; transparente puede verse distinto según el navegador.
    background_color: "#00000000"
    theme_color: "#2563EB"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env.dev
    - .env.prod
    - assets/images/logo/
    - assets/images/game_modes/
